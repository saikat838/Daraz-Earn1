<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>টাস্ক ও ওয়ালেট ড্যাশবোর্ড</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #1e293b;
      position: relative;
      padding-bottom: 75px;
      display: flex;
      flex-direction: column;
    }

    /* Auth Overlay */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0f172a;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .auth-card {
      background: #1e293b;
      padding: 30px 20px;
      border-radius: 16px;
      border: 1px solid #334155;
      width: 100%;
      max-width: 360px;
    }
    .auth-card h2 { margin-bottom: 8px; font-size: 20px; }
    .auth-card p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }

    /* Header */
    .header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #3b82f6;
      border: 2px solid #60a5fa;
    }
    .user-text { font-size: 14px; font-weight: 600; }
    .user-sub { font-size: 11px; color: #10b981; }

    .wallet-card {
