<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>টাস্ক ড্যাশবোর্ড</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #1e293b;
      position: relative;
      padding-bottom: 75px;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .wallet-card {
      margin: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    .wallet-title {
      font-size: 13px;
      color: #bfdbfe;
      margin-bottom: 6px;
    }
    .balance {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .wallet-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-light {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .task-section {
      padding: 0 16px;
      flex: 1;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #94a3b8;
    }
    .task-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-details h4 {
      font-size: 15px;
      margin-bottom: 4px;
    }
    .task-reward {
      font-size: 13px;
      color: #10b981;
      font-weight: 600;
    }
    .btn-action {
      background: #10b981;
      color: white;
      padding: 8px 14px;
      font-size: 12px;
    }
    .btn-done {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #64748b;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-item.active {
      color: #3b82f6;
    }
    .nav-item i {
      font-size: 18px;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- হেডার -->
  <div class="header">
    <div class="user-info">
      <div class="avatar">U</div>
      <div>
        <div style="font-size: 14px; font-weight: 600;">User #84920</div>
        <div style="font-size: 11px; color: #10b981;">লেভেল: ভিআইপি ১</div>
      </div>
    </div>
    <i class="fa-regular fa-bell" style="font-size: 18px; color: #94a3b8;"></i>
  </div>

  <!-- ওয়ালেট সেকশন -->
  <div class="wallet-card">
    <div class="wallet-title">মোট ওয়ালেট ব্যালেন্স</div>
    <div class="balance" id="wallet-balance">৳ ২৫০.০০</div>
    <div class="wallet-actions">
      <button class="btn btn-light" onclick="alert('উইথড্র অপশন সংযুক্ত করতে হবে')"><i class="fa-solid fa-arrow-down"></i> উইথড্র</button>
      <button class="btn btn-light" onclick="alert('ডিপোজিট অপশন সংযুক্ত করতে হবে')"><i class="fa-solid fa-wallet"></i> ডিপোজিট</button>
    </div>
  </div>

  <!-- টাস্ক সেকশন -->
  <div class="task-section">
    <div class="section-title">আজকের টাস্কসমূহ</div>

    <div class="task-card" id="task-1">
      <div class="task-details">
        <h4>ভিডিও রিভিউ ও রেটিং</h4>
        <div class="task-reward">+৳ ২০.০০</div>
      </div>
      <button class="btn btn-action" onclick="completeTask('task-1', 20, 'ভিডিও রিভিউ ও রেটিং')">শুরু করুন</button>
    </div>

    <div class="task-card" id="task-2">
      <div class="task-details">
        <h4>অর্ডার ডেটা ভেরিফিকেশন</h4>
        <div class="task-reward">+৳ ৩৫.০০</div>
      </div>
      <button class="btn btn-action" onclick="completeTask('task-2', 35, 'অর্ডার ডেটা ভেরিফিকেশন')">শুরু করুন</button>
    </div>

    <div class="task-card" id="task-3">
      <div class="task-details">
        <h4>মার্কেট সার্ভে কমপ্লিশন</h4>
        <div class="task-reward">+৳ ৫০.০০</div>
      </div>
      <button class="btn btn-action" onclick="completeTask('task-3', 50, 'মার্কেট সার্ভে কমপ্লিশন')">শুরু করুন</button>
    </div>
  </div>

  <!-- বটম নেভিগেশন বার -->
  <div class="bottom-nav">
    <div class="nav-item active"><i class="fa-solid fa-house"></i>হোম</div>
    <div class="nav-item"><i class="fa-solid fa-list-check"></i>টাস্ক</div>
    <div class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i>হিস্ট্রি</div>
    <div class="nav-item"><i class="fa-solid fa-user"></i>প্রোফাইল</div>
  </div>
</div>

<script>
  let currentBalance = 250.00;

  // টেলিগ্রাম বট কনফিগারেশন (প্রয়োজনে ব্যবহার করতে পারেন)
  const TELEGRAM_BOT_TOKEN = "YOUR_BOT_TOKEN";
  const TELEGRAM_CHAT_ID = "YOUR_CHAT_ID";

  function completeTask(taskId, reward, taskName) {
    const card = document.getElementById(taskId);
    const button = card.querySelector('button');

    button.innerText = 'যাচাই হচ্ছে...';
    button.disabled = true;

    setTimeout(() => {
      currentBalance += reward;
      document.getElementById('wallet-balance').innerText = `৳ ${currentBalance.toFixed(2)}`;
      
      button.innerText = 'সম্পন্ন';
      button.className = 'btn btn-done';

      // টেলিগ্রামে নোটিফিকেশন পাঠানোর রিকোয়েস্ট
      sendTelegramAlert(taskName, reward);
    }, 1200);
  }

  function sendTelegramAlert(taskName, reward) {
    if (TELEGRAM_BOT_TOKEN === "YOUR_BOT_TOKEN") return;

    const message = `🔔 নতুন টাস্ক সম্পন্ন!\n\nইউজার: User #84920\nটাস্ক: ${taskName}\nরিওয়ার্ড: ৳${reward}\nনতুন ব্যালেন্স: ৳${currentBalance.toFixed(2)}`;
    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: message
      })
    }).catch(err => console.error("Telegram Error:", err));
  }
</script>

</body>
</html>
